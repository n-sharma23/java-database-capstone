spring.application.name=back-end

# Connection settings and secrets come from environment variables; nothing secret is committed.
# Local defaults suit a Homebrew MySQL/MongoDB with no root password.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/cms?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/prescriptions}

management.endpoint.health.show-details=always
management.health.db.enabled=true

api.path=/
# HMAC key for signing JWTs: at least 32 characters. Required; the app will not start without it.
jwt.secret=${JWT_SECRET}

# Inserts demo admin/doctors/patients/appointments into empty tables (local demos only).
app.seed-demo-data=${SEED_DEMO_DATA:false}

spring.web.resources.static-locations=classpath:/static/

# -------------------------
# Thymeleaf Configuration
# -------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
